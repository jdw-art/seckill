spring:
  config:
    # 从 .env 读取密钥（.env 已加入 .gitignore）；覆盖项目根目录和模块目录两种启动方式
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 本地开发环境 MySQL 数据源配置
  datasource:
    # 连接地址：数据库名为 xiaoha_seckill
    url: jdbc:mysql://192.168.31.132:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 数据库用户名
    username: root
    # 数据库密码：从环境变量读取，勿写死在仓库里
    password: ${DB_PASSWORD}
    # 数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      # 连接池名称
      pool-name: SeckillHikariPool
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接数
      maximum-pool-size: 50
      # 空闲连接超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大存活时间（毫秒）
      max-lifetime: 900000
      # 获取连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接测试语句
      connection-test-query: SELECT 1
  # Redis 配置
  data:
    redis:
      # Redis 服务器地址
      host: 192.168.31.132
      # Redis 服务器端口
      port: 6379
      # Redis 密码：从环境变量读取，未设置密码时留空即可
      password: ${REDIS_PASSWORD:}
      # 使用的数据库索引（默认 0）
      database: 0
      # 连接超时时间（毫秒）
      timeout: 5000
      # Lettuce 连接池配置（提升连接复用效率）
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 50
          # 连接池最大空闲连接数
          max-idle: 20
          # 连接池最小空闲连接数
          min-idle: 5
          # 连接池最大阻塞等待时间（毫秒），-1 表示无限制
          max-wait: 3000
  # RabbitMQ 配置
  rabbitmq:
    # RabbitMQ 服务器地址
    host: 192.168.31.132
    # AMQP 协议端口（管理后台是 15672，注意区分）
    port: 5672
    # 用户名：从环境变量读取，勿写死在仓库里
    username: ${RABBITMQ_USERNAME}
    # 密码：从环境变量读取，勿写死在仓库里
    password: ${RABBITMQ_PASSWORD}
    # 虚拟主机，用于业务隔离
    virtual-host: /seckill
    # 连接超时时间（毫秒）
    connection-timeout: 15000
    # 消费者监听器配置
    listener:
      simple:
        # 手动 ACK，消费者处理成功后再确认消息
        acknowledge-mode: manual
        # 每个消费者最多持有 5 条未 ack 消息
        prefetch: 5

# MyBatis 开发环境专属配置
mybatis:
  configuration:
    # 开发阶段打印 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义线程池配置
thread-pool:
  # 核心线程数
  core-pool-size: 2
  # 最大线程数
  max-pool-size: 5
  # 队列容量
  queue-capacity: 100
  # 空闲线程存活时间（秒）
  keep-alive-seconds: 60